[project]
name = "vibana-agent"
version = "0.1.0"
description = "Vision-based UI Navigation Agent."
readme = "README.md"
authors = [
    { name = "Nguyen Chi Cuong" },
    { name = "Tran Le Duy" },
    { name = "Dang Truong Hung" },
    { name = "Phan Thuy Phuong" },
    { name = "Nguyen Hoang Quan" },
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "typer>=0.28.0",
]

[project.scripts]
vibana-agent = "vibana_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
